# input: Python 3.12+ 和公开 PyPI 稳定依赖。
# output: uv.lock 固定的 Bub Core、HTTP/SOCKS 代理与本地文档解析环境。
# pos: Python 总结入口的依赖声明。一旦我被更新务必更新我的开头注释以及所属文件夹的 AGENTS.md。
[project]
name = "zoho-workstation-summary"
version = "0.1.0"
requires-python = ">=3.12,<4"
dependencies = [
    "bub==0.6.1",
    "republic==0.6.1",
    "pydantic==2.14.2",
    "httpx2[socks]==2.16.0",
    "pypdf==7.0.0",
    "python-docx==1.2.0",
    "markitdown[docx,pdf]==0.1.9",
]

[tool.uv]
package = false
prerelease = "disallow"
# Last official CPython 3.12 Intel macOS wheel; other platforms retain current stable.
constraint-dependencies = ["onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64' and python_version < '3.14'"]
